<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin: Registered attendees | Campus Events</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <p class="brand"><a href="index.html">Campus Events</a> <span class="brand-tag">Staff</span></p>
      <nav aria-label="Admin navigation">
        <ul>
          <li><a href="index.html">Back to events</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main-content" tabindex="-1">
    <!--
      Developer note: in this prototype the attendee list is read from the browser's
      localStorage (see data.js). In production it reads from the dbo.vw_EventAttendees
      database view through GET /api/admin/events/{id}/attendees.
    -->
    <section class="intro wrap" aria-labelledby="admin-title">
      <h1 id="admin-title">Admin: Registered attendees</h1>
      <p class="notice" role="note">Staff only. Login will be added in a later version.</p>
    </section>

    <section class="wrap" aria-labelledby="attendees-title">
      <h2 id="attendees-title">Attendee list</h2>
      <div class="field narrow">
        <label for="attendee-event">Event</label>
        <select id="attendee-event" aria-label="Event whose attendees to show"></select>
      </div>
      <h3 id="attendee-caption" class="table-title">Attendees</h3>
      <div class="table-scroll" role="region" aria-labelledby="attendee-caption" tabindex="0">
        <table aria-labelledby="attendee-caption">
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Student ID</th>
              <th scope="col">Email</th>
              <th scope="col">Registered</th>
            </tr>
          </thead>
          <tbody id="attendee-body"></tbody>
        </table>
      </div>
      <noscript><p>Turn on JavaScript to see the attendee list.</p></noscript>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Campus Event Management System, staff area.</p>
      <p><a href="index.html">Back to events</a></p>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="admin.js"></script>
</body>
</html>
